# Fund discovery spec — feeds `discover funds`. See flexicap-allweather-fund.yml for the schema note.
# Research large-cap funds during a weak or volatile market. The category is
# still equity risk: neither lower drawdown nor recovery is guaranteed.

name: largecap-defensive-fund
version: 1
created: 2026-08-30
purpose: fund
archetype: defensive-largecap
goal: "Research large-cap funds for a weak or volatile market; capital remains at risk"
source_references:
  - "Zerodha Varsity — Mutual Funds, general educational reference. The category/regime/AUM choices here are plugin research assumptions, not a capital-protection claim."

status: draft  # Research template; no activation or performance evidence supplied.
lifecycle:
  generated_at: 2026-08-30
  validated_at: null
  activated_at: null

regime_required:
  market_trend: down
  vix_max: 40                          # deliberately tolerant — this is the sleeve you hold INTO high vol

scan:
  category: large cap fund
  window: 5y                          # compare observed rolling returns and drawdowns; five years need not cover a full cycle
  min_aum: 5000                       # large-cap funds should have real scale
  top: 5
