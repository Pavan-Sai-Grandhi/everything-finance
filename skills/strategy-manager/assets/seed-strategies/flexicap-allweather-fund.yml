# Fund discovery spec — feeds `discover funds`.
# A FUND spec is the fund analogue of an investment spec: it does NOT re-implement fund scoring
# (get_fund_scan owns the hard gates + the published weight table, unchanged), it supplies the
# CYCLE -> SEBI-category + scan-window + AUM-floor choice that discover funds otherwise improvises.
# Its fields map 1:1 onto get_fund_scan(category, min_aum, window, top) — nothing here is scored
# by hand. `category` MUST be a SEBI sub-category get_fund_scan knows (small cap fund | mid cap
# fund | large cap fund | elss | flexi cap fund | multi cap fund | large & mid cap fund).

name: flexicap-allweather-fund
version: 1
created: 2026-08-30
purpose: fund
archetype: core-allweather
goal: "The all-weather core SIP — one manager free to move across the cap curve as the cycle turns"
source_references:
  - "Zerodha Varsity — Personal Finance / Mutual Funds (core-satellite; flexi cap as the all-weather core; judge on rolling returns + cost, not point-to-point). Official source."
  - "SOIC — let a proven manager handle cap-allocation across the cycle rather than timing caps yourself."

status: draft                         # active on the completeness gate (category resolvable in get_fund_scan)
lifecycle:
  generated_at: 2026-08-30
  validated_at: null
  activated_at: null

regime_required:
  market_trend: any                   # the CORE holding — held through every regime, not timed

# Consumed as get_fund_scan arguments by `discover funds`:
scan:
  category: flexi cap fund
  window: 5y                          # credit the through-cycle record, not a 3y bull run
  min_aum: 1000                       # ₹Cr viability floor
  top: 5
