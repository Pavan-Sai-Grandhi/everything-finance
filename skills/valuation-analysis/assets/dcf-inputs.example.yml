# SYNTHETIC EXAMPLE ONLY — none of these numbers represents a company or current market data.
# Source annotations below describe what to obtain, not evidence for the sample values.
# Before a real valuation, replace every observed input with primary-source evidence and
# its observation date; label every forecast assumption and explain its rationale.
# The engine cannot verify provenance. Preserve the completed input file as the audit trail.
# Use ₹ Crore for money fields and CRORE SHARES (a count, not currency) for shares_outstanding.
# Copy this file and retain only the chosen alternative. Duplicate YAML/JSON fields are rejected.

currency_unit: "INR Crore"
years: 10                       # explicit horizon; use 15 for a genuinely YOUNG/high-growth firm
# Life-cycle stage drives WHICH levers matter (see reference § "Diagnose first") — set it honestly:
lifecycle_stage: mature_stable  # start_up | young_growth | high_growth | mature_growth | mature_stable | decline

# --- base (sourced from the latest consolidated financials) ----------------------------
base_revenue: 90000.0           # latest FY / TTM Revenue from Operations [src: annual report FY24]
base_revenue_basis: revenue_from_operations  # excludes interest/investment/other non-operating income
shares_outstanding: 700.0       # diluted share count, crore shares  [src: balance_sheet_10y Common Shares Outstanding]
net_debt: 12000.0               # total debt − cash                [src: balance_sheet_10y Total Debt − Cash and Equivalent]
non_operating_cash: 0.0         # cash/investments not in FCFF      [src: balance_sheet_10y Long Term Investments]
minority_interest: 0.0          # minority interest to subtract     [src: balance_sheet_10y Minority Interest]
current_price: 1500.0           # market price/share, ₹             [src: get_quote]
timing:                         # mid-year flows, rolled forward to the price date
  base_period_end: "2026-03-31"  # the day the base_revenue period ends (FY or TTM window)
  valuation_date: "2026-09-30"   # the date of current_price
# Reconcile historical cash flows with the model definitions before using them as a check.
# Accounting free cash flow and modeled FCFF may differ in taxes, interest and reinvestment;
# a discrepancy requires explanation and is not by itself proof that an input is wrong.

# --- revenue growth: EITHER an explicit path OR a high->fade glide ----------------------
# revenue_growth: [0.15, 0.15, 0.13, 0.12, 0.11, 0.10, 0.09, 0.08, 0.08, 0.07]
growth_glide:                   # 15% for 3y, then linear fade toward the terminal rate by year 10
  initial: 0.15                 #   [story: TAM + share gains from <edge>]
  fade_to: 0.07                 #   [land near terminal growth — no discontinuity into perpetuity]
  years_high: 3

# --- operating margin (pre-tax EBIT margin): explicit path OR a glide -------------------
# `current_ebit_margin` is latest FY operating EBIT / Revenue from Operations. It is what the engine checks
# the year-1 margin against: the published "OPM %" is struck at EBITDA, and feeding that into
# `operating_margin` overstates every year's cash flow. Omit it and the check is skipped, and
# the engine says so.
current_ebit_margin: 0.18         #   [src: operating EBIT / Revenue from Operations, FY25 consolidated]
# operating_margin: [0.18, 0.19, 0.20, 0.21, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22]
margin_glide:                   # ramp 18% -> 22% by year 5, hold
  start: 0.18                   #   [src: current EBIT margin]
  target: 0.22                  #   [benchmark: peer steady-state margins]
  year_target: 5

tax_rate: 0.25                  # effective -> statutory            [src: annual report tax note — NEVER
                                #   derived from the "Taxes & Other Items" row; see reference § levers]
sales_to_capital: 2.5           # ₹ sales per ₹ invested (scalar or list)
                                #   [hist: ΔRev ÷ (capex − depreciation + ΔWC), averaged over several years.
                                #    capex   src: cash_flow_10y Capital Expenditures
                                #    deprec. src: pnl_10y Depreciation & Amortization
                                #    ΔWC     DERIVED from balance_sheet_10y (Total Receivables + Total
                                #            Inventory − Accounts Payable); the cash_flow_10y row named
                                #            "Changes in Working Capital" is NOT a WC movement — see
                                #            reference § Sourcing the reinvestment]

# --- discount rate: EITHER a single `wacc` OR a `wacc_buildup` (preferred for India: makes
#     the country-risk premium explicit instead of buried in one guessed number) ----------
# wacc: 0.13                     # CoE+CoD weighted, ₹ terms — OR build it up (preferred):
wacc_buildup:
  government_bond_yield: 0.068  # get_risk_inputs india_10y.value   [TradingView TVC:IN10Y + as_of]
  sovereign_default_spread: 0.0195 # get_risk_inputs country_risk.default_spread [Damodaran + as_of]
  beta: 1.1                     # BOTTOM-UP / sector beta (business risk), NOT the stock's regression beta
                                #   [src: unlevered peer betas, relevered; >1.3 trips a flag — recheck]
  mature_erp: 0.0508            # get_risk_inputs country_risk.mature_erp [Damodaran + as_of]
  country_risk_premium: 0.0219  # get_risk_inputs country_risk.country_risk_premium; add once [same vintage]
  lambda_country: 1.0           # India OPERATING exposure: ~1 domestic; ~0.1 for an IT exporter (see reference)
  cost_of_debt_pretax: 0.09     # [src: interest/avg debt or rating spread]
  equity_weight: 0.90           # market-value weights
  tax_rate: 0.25

# --- terminal (stable-growth firm) -----------------------------------------------------
# terminal_growth is bounded by the DEFAULT-FREE INR rate (government yield minus sovereign
# default spread), not by the headline G-sec yield. For a DECLINING firm use <= 0.
terminal_growth: 0.045
terminal_wacc: 0.12             # mature-firm discount rate (defaults to last wacc)
terminal_margin: 0.22           # steady-state margin (defaults to last margin)
terminal_roic: 0.15             # return on new capital in perpetuity. The excess return (this − terminal_wacc)
                                #   affects terminal reinvestment; defaults to convergence (= wacc) if omitted —
                                #   justify any persistent excess return. Compare sensitivities to identify material drivers.
# Do not duplicate `risk_free` here when wacc_buildup derives it. If using an explicit `wacc`,
# supply the already default-free rate here so the terminal-growth guard can run.
# risk_free: 0.0485

# Banks / NBFCs / insurers only:
# model_shape: equity            # net-income stream, regulatory-capital reinvestment, cost of equity
# This requires replacing the FCFF assumptions above: every explicit/terminal margin = 1,
# every explicit/terminal tax rate = 0, net_debt = 0, and buildup weights equity=1/debt=0.
# Merely changing model_shape on this operating-company example is invalid.

# --- post-operating adjustments: apply ONLY when the diagnosis calls for them (see reference) ---
# failure_probability: 0.10     # distress haircut — loss-making + heavy debt, or decline-phase; ~0 for mature
# failure_recovery: 0.0         # fraction of equity recovered in failure (usually 0)
# complexity_discount: 0.20     # governance/cross-holding/promoter-control haircut; justify explicitly if used
