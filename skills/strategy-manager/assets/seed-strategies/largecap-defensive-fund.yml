# Fund discovery spec — feeds `discover funds`. See flexicap-allweather-fund.yml for the schema note.
# CYCLE: weak / falling / high-volatility tape — the drawdown-protection sleeve. When breadth is
# poor and VIX is elevated, large-cap funds fall less and recover cleaner; you rotate the satellite
# here (or to cash/debt) and keep the core intact.

name: largecap-defensive-fund
version: 1
created: 2026-08-30
purpose: fund
archetype: defensive-largecap
goal: "Drawdown-protection sleeve — a large-cap fund for a weak or volatile market"
source_references:
  - "Zerodha Varsity — Mutual Funds (large caps for capital protection in a downturn; judge on worst rolling window + max drawdown, which get_fund_scan already weights). Official source."

status: draft
lifecycle:
  generated_at: 2026-08-30
  validated_at: null
  activated_at: null

regime_required:
  market_trend: down
  vix_max: 40                          # deliberately tolerant — this is the sleeve you hold INTO high vol

scan:
  category: large cap fund
  window: 5y                          # reward the fund that protected capital across a full cycle
  min_aum: 5000                       # large-cap funds should have real scale
  top: 5
